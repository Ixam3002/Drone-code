name: Secret Scan

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - develop

  schedule:
    # Scan complet de l'historique toutes les nuits
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
